<!doctype html><meta charset="utf-8"><body>
<script src="../dist/anytars.js"></script>
<script>
// ---------- seeded random avatars over the full option space ----------
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const SKINS=['#fbe3d3','#f5d6c4','#f2cfae','#efc2a4','#e2ad84','#d0a27a','#c98d5b','#a8703f','#8a5530','#6b4128','#4a2b1a'];
const HAIRS=['#1d1a1f','#2b1d16','#4a3222','#6e5038','#cfac72','#e6cf98','#b5441f','#d4cfc8','#f4f1ec','#3d6fd8','#d65a9c'];
const EYEC=['#2e1c12','#5b3b22','#8a6a2f','#3f8f5a','#4c86c9','#7a93a8'];
const CLOTH=['#202027','#e3554a','#d9682b','#e8c35a','#6b8f3a','#2d7d6e','#3d5a80','#7a3b69','#f0ede6'];
function randomAvatar(seed){
  const r = mulberry32(seed), pick = a => a[Math.floor(r()*a.length)], chance = p => r() < p, int = (a,b) => a + Math.floor(r()*(b-a+1));
  const eye = pick(EYEC);
  const t = {
    skin: pick(SKINS), face: pick(ENUMS.face),
    hair: { top: pick(ENUMS.hairTop), back: pick(ENUMS.hairBack), color: pick(HAIRS) },
    eyes: { shape: pick(ENUMS.eyeShape), left: eye, right: chance(.1) ? pick(EYEC) : eye, lashes: pick(ENUMS.lashes) },
    brows: { type: pick(ENUMS.brows) }, nose: { type: pick(ENUMS.nose.filter(n=>n!=='anime')) },
    mouth: { width: pick(ENUMS.mouthWidth), lips: pick(ENUMS.lips) },
    facialHair: chance(.45) ? 'none' : pick(ENUMS.facialHair.filter(f=>f!=='none')),
    details: ['freckles','wrinkles','mole','vitiligo'].filter(() => chance(.15)),
    glasses: chance(.45) ? {type:'none'} : { type: pick(ENUMS.glasses.filter(g=>g!=='none')), frame: pick(['#16161a','#c79a2b','#c0c4cc','#d0457a']), lens: pick(['#ffffff','#1d2229','#e86a8a']), lensAlpha: pick([.12,.4,.9]) },
    headwear: chance(.45) ? {type:'none'} : { type: pick(ENUMS.headwear.filter(h=>h!=='none')), color: pick(CLOTH) },
    shirt: pick(CLOTH), bg: '#cfe0ee',
  };
  if (chance(.5)) t.eyes.render = pick(EYE_RENDER);
  if (chance(.2)) t.brows.color = pick(HAIRS);
  if (chance(.2)) t.facialHairColor = pick(HAIRS);
  if (chance(.2)) t.hair.accent = pick(HAIRS);
  if (chance(.3)) t.headwear.accent = pick(CLOTH);
  if (chance(.3)) t.cheeks = { amount: pick(['none','light','medium','strong']), ...(chance(.5) ? { color: pick(['#ff8a8a','#d6246e']) } : {}) };
  TUNE.forEach(x => { if (chance(.5)) { const v = int(x.min, x.max); if (v) setK(t, x.key, v); } });
  return t;
}

// ---------- string-level validity ----------
function validate(svg){
  const errs = [];
  if (/NaN|undefined|Infinity|\[object|null/.test(svg)) errs.push('bad-token:' + (svg.match(/.{20}(NaN|undefined|Infinity|\[object|null).{20}/)||[''])[0]);
  const ids = [...svg.matchAll(/ id="([^"]+)"/g)].map(m=>m[1]);
  const set = new Set(ids); if (set.size !== ids.length) errs.push('duplicate-id');
  for (const m of svg.matchAll(/url\(#([^)]+)\)/g)) if (!set.has(m[1])) { errs.push('dangling-ref:'+m[1]); break; }
  return errs;
}
const parser = new DOMParser();
function parses(svg){ return !parser.parseFromString(svg, 'image/svg+xml').querySelector('parsererror'); }

// ---------- raster masks per layer ----------
const N = 128, cv = document.createElement('canvas'); cv.width = cv.height = N; const cx = cv.getContext('2d', {willReadFrequently:true});
async function mask(svg, layers, thr){
  const style = `<style>*{visibility:hidden}${layers.map(l=>`[data-l="${l}"] *`).join(',')}{visibility:visible}[filter]{filter:none!important}</style>`;
  const s = svg.replace(/(<svg[^>]*>)/, `$1${style}`).replace('<svg ', `<svg width="${N}" height="${N}" `);
  const img = new Image(); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s); await img.decode();
  cx.clearRect(0,0,N,N); cx.drawImage(img,0,0,N,N);
  const d = cx.getImageData(0,0,N,N).data, m = new Uint8Array(N*N);
  for (let i=0;i<N*N;i++) m[i] = d[i*4+3] > (thr||64) ? 1 : 0;
  return m;
}
const count = m => { let c=0; for (let i=0;i<m.length;i++) c+=m[i]; return c; };
const and = (a,b) => { let c=0; for (let i=0;i<a.length;i++) c += a[i]&b[i]; return c; };
const andNot = (a,b) => { let c=0; for (let i=0;i<a.length;i++) c += a[i]&(1-b[i]); return c; };
const or = (...ms) => { const o = new Uint8Array(N*N); ms.forEach(m => { for (let i=0;i<o.length;i++) o[i] |= m[i]; }); return o; };
function dilate(m, r){ const o = new Uint8Array(N*N); for (let y=0;y<N;y++) for (let x=0;x<N;x++) if (m[y*N+x]) for (let dy=-r;dy<=r;dy++) for (let dx=-r;dx<=r;dx++){ const X=x+dx,Y=y+dy; if (X>=0&&Y>=0&&X<N&&Y<N) o[Y*N+X]=1; } return o; }
function bbox(m){ let y0=N,y1=-1; for (let i=0;i<m.length;i++) if (m[i]){ const y=(i/N)|0; if (y<y0) y0=y; if (y>y1) y1=y; } return {y0,y1}; }

async function rasterChecks(t, style){
  const svg = render(t, {expression:'neutral'}, style, {background:'none', backgroundShape:'none'});
  const L = {};
  for (const [k, ls, thr] of [['E',['eyes']],['B',['brows']],['G',['glasses'],8],['C',['hairTop','headwear']],['W',['headwear']],['Hd',['head']],['Bd',['beard']],['M',['mouth']],['HT',['hairTop']],['HB',['hairBack']],['EA',['ears']],['N',['nose']]])
    L[k] = await mask(svg, ls, thr);
  const n = {}; for (const k in L) n[k] = count(L[k]);
  const f = [];
  const gt = t.glasses?.type || 'none', hw = t.headwear?.type || 'none', fh = t.facialHair || 'none';
  if (n.E > 10 && and(L.E, L.C)/n.E > .12) f.push(['eyes-covered', and(L.E,L.C)/n.E]);
  if (n.B > 10 && and(L.B, L.W)/n.B > .6) f.push(['brows-under-hat', and(L.B,L.W)/n.B]);
  if (gt !== 'none' && gt !== 'monocle' && gt !== 'half' && n.E > 10 && andNot(L.E, L.G)/n.E > .35) f.push(['glasses-off-eyes', andNot(L.E,L.G)/n.E]);
  if (gt === 'monocle' && n.E > 10 && and(L.E, L.G)/n.E < .2) f.push(['monocle-off-eye', and(L.E,L.G)/n.E]);
  if (!/^hijab/.test(hw) && n.G > 10 && and(L.G, L.W)/n.G > .15) f.push(['glasses-under-hat', and(L.G,L.W)/n.G]);
  // cropped at the canvas edge (upper part only; shoulders legitimately touch the bottom and sides)
  const edge = m => { let c=0; for (let x=0;x<N;x++){ c += m[x] + m[N+x]; } for (let y=0;y<N*0.6;y++){ c += m[y*N] + m[y*N+N-1]; } return c; };
  const ec = edge(or(L.HT, L.W, L.HB)); if (ec > 3) f.push(['cropped-at-edge', ec]);
  if (['full','short','long'].includes(fh) && n.M > 5){
    const {y1} = bbox(L.M); let leak = 0;
    for (let i=0;i<N*N;i++){ const y=(i/N)|0; if (y > y1+2 && L.Hd[i] && !L.Bd[i] && !L.M[i]) leak++; }
    if (leak/n.Hd > .006) f.push(['skin-past-beard', leak/n.Hd]);
  }
  if (n.W > 5 && !/^hijab/.test(hw)){ const base = dilate(or(L.Hd, L.HT, L.HB, L.EA), 2); if (and(L.W, base) === 0) f.push(['hat-floating', 0]); }
  if (n.M > 5 && and(L.M, L.G)/n.M > .25) f.push(['glasses-over-mouth', and(L.M,L.G)/n.M]);
  if (n.B > 10 && and(L.B, L.E)/n.B > .1) f.push(['brows-overlap-eyes', and(L.B,L.E)/n.B]);
  if (n.E > 10 && andNot(L.E, L.Hd)/n.E > .05) f.push(['eyes-outside-face', andNot(L.E,L.Hd)/n.E]);
  if (n.M > 5 && andNot(L.M, or(L.Hd, L.Bd))/n.M > .1) f.push(['mouth-outside-face', andNot(L.M, or(L.Hd,L.Bd))/n.M]);
  if (n.M > 5 && and(L.M, L.HT)/n.M > .1) f.push(['hair-over-mouth', and(L.M,L.HT)/n.M]);
  if (n.N > 3 && n.M > 5 && and(L.N, L.M)/n.N > .15) f.push(['nose-overlaps-mouth', and(L.N,L.M)/n.N]);
  if (n.N > 3 && and(L.N, L.Bd)/n.N > .35) f.push(['beard-over-nose', and(L.N,L.Bd)/n.N]);
  if (n.N > 3 && and(L.N, L.E)/n.N > .15) f.push(['nose-overlaps-eyes', and(L.N,L.E)/n.N]);
  return f.map(([k,v]) => ({k, v: Math.round(v*1000)/1000}));
}

async function runChunk(start, n){
  const styles = Object.keys(STYLES), variants = VARIANTS;
  const out = { strErrors: [], rasterFlags: [], renders: 0, parsed: 0 };
  for (let i = start; i < start + n; i++){
    const t = randomAvatar(1000 + i), code = encode(t);
    // every style x every version: string validity
    for (const st of styles) for (const v of variants){
      let svg; try { svg = render(t, v, st, {background:'none', backgroundShape:'none'}); } catch(e){ out.strErrors.push({i, st, v, code, err:'throw:'+e.message}); continue; }
      out.renders++;
      const errs = validate(svg); if (errs.length) out.strErrors.push({i, st, v, code, err: errs.join(';')});
      if ((i + out.renders) % 9 === 0){ out.parsed++; if (!parses(svg)) out.strErrors.push({i, st, v, code, err:'xml-parse'}); }
    }
    // raster checks: one style per avatar, rotating
    const st = styles[i % styles.length];
    const flags = await rasterChecks(t, st);
    if (flags.length) out.rasterFlags.push({i, st, code, flags});
  }
  return out;
}
</script>
</body>
